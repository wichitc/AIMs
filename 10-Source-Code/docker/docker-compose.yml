name: aims

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aims}
      POSTGRES_DB: ${POSTGRES_DB:-aims}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aims}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  backend:
    build:
      context: ../backend
    # SEED_DEMO_DATA creates a login-ready admin user (see app/seed.py) — opt-in via env var
    # rather than always-on, so this command is safe to reuse for staging/production where
    # seeding a well-known admin password would be a real vulnerability.
    command: sh -c "alembic upgrade head && ([ \"$SEED_DEMO_DATA\" = 'true' ] && python -m app.seed || true) && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aims}:${POSTGRES_PASSWORD:-aims}@postgres:5432/${POSTGRES_DB:-aims}
      REDIS_URL: redis://redis:6379/0
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ../ai-service
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aims}:${POSTGRES_PASSWORD:-aims}@postgres:5432/${POSTGRES_DB:-aims}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy  # backend's migration owns the tables ai-service reads

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/v1}
        NEXT_PUBLIC_AI_API_BASE_URL: ${NEXT_PUBLIC_AI_API_BASE_URL:-http://localhost:8001/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - ai-service

volumes:
  postgres_data:
  mosquitto_data:
